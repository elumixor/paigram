name: TestFlight

# Dispatched only, on an `ios-v*` tag cut by `bun run tag`: pai's build card runs
# `gh workflow run testflight.yml --ref ios-vX.Y.Z`. It runs on the developer's Mac as a self-hosted runner
# (label `paigram-mac`): free, and fast from its warm Bazel cache. While the Mac sleeps the job waits in
# the queue. No GitHub-hosted fallback: macOS runners bill at ten times the Linux rate. A failed run is
# dispatched again once the Mac is fixed. A version already on TestFlight uploads nothing (`--once`).
on:
  workflow_dispatch:
    inputs:
      check_signing:
        description: only check out, import the certificate and sign a scratch binary; build and upload nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, paigram-mac]
    # A warm build takes 15–40 minutes; a cold cache about 90. Longer than this is a stalled Mac.
    timeout-minutes: 150
    steps:
      # The runner's own checkout of the dispatched ref, kept between runs (its Bazel output base is keyed
      # by this path), not the synced ~/dev tree, which holds other sessions' uncommitted work.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - run: bun install --frozen-lockfile

      # The runner service has no unlocked login keychain (codesign fails with errSecInternalComponent),
      # so the distribution certificate goes into a throwaway keychain, as on a GitHub runner, and a
      # scratch binary is signed with it before anything is built.
      - name: Prepare signing and configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PAI_BOX_URL: ${{ secrets.PAI_BOX_URL }}
          PAI_BOT_USERNAME: ${{ secrets.PAI_BOT_USERNAME }}
        run: bun scripts/ci.ts

      - name: Build and upload
        if: ${{ !inputs.check_signing }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PAI_BOX_URL: ${{ secrets.PAI_BOX_URL }}
          PAI_BOT_USERNAME: ${{ secrets.PAI_BOT_USERNAME }}
        run: bun scripts/mac-release.ts "$GITHUB_REF_NAME"

      - name: Delete the signing keychain
        if: always()
        run: bun scripts/ci.ts --cleanup
