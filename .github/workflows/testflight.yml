name: TestFlight

# Push a tag (`bun run tag`, from this Mac, the box or pai's chat) and the build lands on the phone. It runs
# on the developer's Mac as a self-hosted runner (label `paigram-mac`): free, and fast from its warm Bazel
# cache. While the Mac sleeps the job waits in the queue, and the same tag's GitHub runner build
# (`testflight-hosted.yml`) ships it instead; whichever finishes second does nothing.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

# Lets mac-release.ts cancel the GitHub runner's build of the same tag: the runner service has no gh login.
permissions:
  actions: write
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, paigram-mac]
    timeout-minutes: 180
    steps:
      - name: Build and upload from ~/dev/paigram
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd "$HOME/dev/paigram" && bun scripts/mac-release.ts "$GITHUB_REF_NAME"
