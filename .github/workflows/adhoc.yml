name: Ad Hoc build (GitHub runner)
run-name: Ad Hoc ${{ inputs.job }}

# dev's "Update iPhone" (desk-dev `src/device/update.ts`): the release build signed Ad Hoc for every device on the
# account, uploaded to dev's box as an over-the-air install link that pai pushes to Paigram. dev dispatches it with the
# commit (pushed to refs/dev-builds/* first), its job id (in the run name, so dev finds the run) and the project slug,
# and races it with the Mac: whichever ends first wins, and dev cancels this run if the Mac does. Nothing else starts it.
# GitHub's macOS pool often refuses the job ("not acquired by Runner of type hosted" after 15 minutes): a build that
# never got a machine is tried once more on the macOS 15 image, as testflight-hosted.yml does.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: the commit to build
        required: true
        type: string
      job:
        description: dev's update job id
        required: true
        type: string
      slug:
        description: dev's project slug
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: adhoc
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/adhoc-build.yml
    with:
      runner: macos-26
      sha: ${{ inputs.sha }}
      job: ${{ inputs.job }}
      slug: ${{ inputs.slug }}
    secrets: inherit

  retry-check:
    needs: build
    if: always() && needs.build.result != 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      retry: ${{ steps.decide.outputs.retry }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate --jq '[.jobs[] | select(.name | startswith("build / "))] | first')
          if [ "$(echo "$job" | jq -r '.runner_name // ""')" = "" ] && [ "$(echo "$job" | jq '.steps | length')" = 0 ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No macOS 26 runner took the build; trying the macOS 15 image."
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

  build-retry:
    needs: retry-check
    if: always() && needs.retry-check.outputs.retry == 'true'
    uses: ./.github/workflows/adhoc-build.yml
    with:
      runner: macos-15
      sha: ${{ inputs.sha }}
      job: ${{ inputs.job }}
      slug: ${{ inputs.slug }}
    secrets: inherit
