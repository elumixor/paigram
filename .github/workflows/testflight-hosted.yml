name: TestFlight (GitHub runner)

# The same release on a GitHub macOS runner (free for this public repo, about 1h40 with the queue),
# started by every tag alongside the Mac's (`testflight.yml`) so a release goes out even while that Mac
# is off. `gate` steps aside when the Mac has picked the tag up (the Mac's own `fallback` job starts this
# workflow again should its build fail); a run started by hand or by that fallback always builds.
# GitHub's macOS pool often refuses the job outright ("not acquired by Runner of type hosted" after 15
# minutes), so a build that never got a machine is tried once more on the macOS 15 image, which has the
# same Xcode and a shorter queue.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: testflight-hosted
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The Mac's runner picks a job up within seconds of the push when it is awake.
          sleep 45
          status=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow testflight.yml --branch "$GITHUB_REF_NAME" --limit 1 --json status --jq '.[0].status // "none"')
          echo "the Mac's run of $GITHUB_REF_NAME is: $status"
          case "$status" in
            queued|waiting|pending|requested|none) echo "build=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::The Mac is building $GITHUB_REF_NAME; this run steps aside (its fallback job starts this workflow again if that build fails)." ;;
          esac

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/testflight-hosted-build.yml
    with:
      runner: macos-26
    secrets: inherit

  # Only a job that never reached a machine is retried: a build that failed on its own would fail again.
  retry-check:
    needs: [gate, build]
    if: always() && needs.gate.outputs.build == 'true' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      retry: ${{ steps.decide.outputs.retry }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate --jq '[.jobs[] | select(.name | startswith("build / "))] | first')
          echo "$job" | jq '{name, conclusion, runner_name, steps: (.steps | length)}'
          if [ "$(echo "$job" | jq -r '.runner_name // ""')" = "" ] && [ "$(echo "$job" | jq '.steps | length')" = 0 ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No macOS 26 runner took the build; trying the macOS 15 image."
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

  # `always()`: without a status function the condition also asks that `build` succeeded, further up the chain.
  build-retry:
    needs: retry-check
    if: always() && needs.retry-check.outputs.retry == 'true'
    uses: ./.github/workflows/testflight-hosted-build.yml
    with:
      runner: macos-15
    secrets: inherit
