# Weekly: opens an issue when Telegram-iOS tags a release that master has not merged yet.
name: Upstream check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - id: check
        run: bun scripts/upstream-check.ts || true
      - if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          title="Merge upstream $LATEST"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "Telegram-iOS tagged $LATEST; master has $CURRENT ($BEHIND upstream commits behind). Process: PAIGRAM.md, Upstream."
          fi
